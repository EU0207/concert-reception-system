name: 作業
description: 開発、文書作成、調査、確認などの作業を登録します
title: "[Task] "
labels: []
projects: ["EU0207/1"]
body:
  - type: markdown
    attributes:
      value: |
        システム開発上の目的と、確認可能な完了条件を記載してください。
        個人情報、秘密情報、作成者個人の事情は記載しないでください。
        タイトルにも工程を明記してください（例：[Detail Design]、[Implementation]）。
  - type: dropdown
    id: phase
    attributes:
      label: 工程
      description: このIssueで完了させる作業の工程を選んでください。背景となった変更の発生時期とは区別します。
      options:
        - 詳細設計
        - 本番実装・担当試験
        - 受入試験
        - 調査・技術検証
        - 保守・管理
        - 要件・基本設計
        - UIモック
    validations:
      required: true
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: この作業によって解決する業務上または開発上の課題を記載してください。
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 作業が必要になった経緯、前提、制約を記載してください。
    validations:
      required: true
  - type: textarea
    id: requester_confirmation
    attributes:
      label: 依頼者への確認・承認
      description: 依頼者の判断が必要な事項を箇条書きで記載してください。不要な場合は「なし」と記載してください。
      value: |
        **依頼者に確認してください**

        - なし
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 作業内容
      description: 実施する内容をチェックリストで記載してください。
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: completion
    attributes:
      label: 完了条件
      description: このIssueを完了できる具体的な条件を記載してください。
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: related_documents
    attributes:
      label: 関連文書
      description: 関連する要件、設計、ADRなどのリンクを記載してください。ない場合は「なし」と記載してください。
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 対象外
      description: このIssueでは対応しない内容を記載してください。ない場合は「なし」と記載してください。
    validations:
      required: true
